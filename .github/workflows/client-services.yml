name: Client service safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verified-client-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "homeassistant==2026.9.4" aiohttp_cors aiodiscover scapy async_upnp_client
      - run: python -m unittest tests.test_client_identity

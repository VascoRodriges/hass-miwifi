name: Checks prerelease HASS

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  py-compile-test:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install --pre homeassistant aiohttp_cors aiodiscover scapy async_upnp_client
      - run: python -m compileall -q custom_components/miwifi
      - run: python -m unittest tests.test_client_identity tests.test_backend_safety

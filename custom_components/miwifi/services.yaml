calc_passwd:
  name: Calculate passwd
  description: Calculate default passwd.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false

request:
  name: Send request
  description: Send request to router.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false
    uri:
      name: Uri
      description: Request uri.
      required: true
      example: "misystem/led"
      selector:
        text:
    body:
      name: Body
      description: Request body.
      required: false
      example: |
        on: 1
      selector:
        object:

set_mac_filter:
  name: Set MAC filter
  description: Change one client's WAN permission, verify it by router readback, and return verified/changed. Does not block mobile internet or guarantee protection against alternate gateways.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false
    mac:
      name: MAC address
      description: MAC address of the device to block or unblock.
      required: true
      example: "00:00:00:00:00:00"
      selector:
        text:
    wan:
      name: WAN access
      description: "0 - block, 1 - unblock."
      required: false
      default: "0"
      selector:
        select:
          options:
            - label: "Block"
              value: "0"
            - label: "Unblock"
              value: "1"

get_client_status:
  name: Read client status
  description: Read one exact client's WAN permission, online status, current IP and DHCP reservation directly from the router. Does not change settings; fails if identity/permission cannot be verified.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false
    mac:
      name: MAC address
      required: true
      example: "02:12:34:56:78:90"
      selector:
        text:

macbind_info:
  name: MAC bind info
  description: Get the list of MAC-bound clients from the router.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false

mac_bind:
  name: Bind MAC
  description: Bind a client IP address to its MAC address.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false
    ip:
      name: IP address
      description: Client IP address to bind.
      required: true
      example: "192.168.31.100"
      selector:
        text:
    mac:
      name: MAC address
      description: Client MAC address to bind.
      required: true
      example: "00:00:00:00:00:00"
      selector:
        text:
    name:
      name: Device name
      description: Device name stored by the router for this binding.
      required: true
      example: "MiniPC"
      selector:
        text:

mac_unbind:
  name: Unbind MAC
  description: Remove an existing IP to MAC binding.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false
    mac:
      name: MAC address
      description: Client MAC address to unbind.
      required: true
      example: "00:00:00:00:00:00"
      selector:
        text:

cleanup_stale_clients:
  name: Cleanup stale clients
  description: Preview stale clients by default. Online, reserved and shared devices are protected. Actual removal requires dry_run=false and confirm=true.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false
    days:
      name: Days
      description: Override the stale age threshold in days. If omitted, the integration activity_days option is used.
      required: false
      example: 30
      selector:
        number:
          min: 1
          max: 3650
          mode: box
    dry_run:
      name: Preview only
      default: true
      selector:
        boolean:
    confirm:
      name: Confirm removal
      default: false
      selector:
        boolean:

port_forward_list:
  name: Port forward list
  description: List all port forwarding rules on the router.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false

add_port_forward:
  name: Add port forward
  description: Add a port forwarding rule.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false
    name:
      name: Rule name
      description: Name of the port forwarding rule.
      required: true
      example: "Web server"
      selector:
        text:
    proto:
      name: Protocol
      description: Protocol to forward.
      required: true
      default: tcp
      selector:
        select:
          options:
            - label: "TCP"
              value: "tcp"
            - label: "UDP"
              value: "udp"
            - label: "TCP + UDP"
              value: "both"
    fwd_ip:
      name: Forward IP
      description: Destination IP address.
      required: true
      example: "192.168.31.100"
      selector:
        text:
    fwd_port:
      name: Forward port
      description: Destination port (1-65535).
      required: true
      example: 80
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    ext_port:
      name: External port
      description: External port (1-65535).
      required: true
      example: 8080
      selector:
        number:
          min: 1
          max: 65535
          mode: box

delete_port_forward:
  name: Delete port forward
  description: Delete a port forwarding rule.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false
    proto:
      name: Protocol
      description: Protocol of the rule.
      required: true
      default: tcp
      selector:
        select:
          options:
            - label: "TCP"
              value: "tcp"
            - label: "UDP"
              value: "udp"
            - label: "TCP + UDP"
              value: "both"
    ext_port:
      name: External port
      description: External port of the rule.
      required: true
      example: 8080
      selector:
        number:
          min: 1
          max: 65535
          mode: box

qos_info:
  name: QoS info
  description: Get QoS (bandwidth control) information.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false

set_qos:
  name: Set QoS
  description: Set per-device bandwidth limit.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false
    mac:
      name: MAC address
      description: MAC address of the device.
      required: true
      example: "00:00:00:00:00:00"
      selector:
        text:
    upload:
      name: Upload limit
      description: Upload speed limit in KB/s. 0 for unlimited.
      required: true
      example: 1024
      selector:
        number:
          min: 0
          max: 1000000
          unit_of_measurement: "KB/s"
          mode: box
    download:
      name: Download limit
      description: Download speed limit in KB/s. 0 for unlimited.
      required: true
      example: 2048
      selector:
        number:
          min: 0
          max: 1000000
          unit_of_measurement: "KB/s"
          mode: box

wifi_timer_info:
  name: WiFi timer info
  description: Get WiFi timer (parental control) schedules.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false

set_wifi_timer:
  name: Set WiFi timer
  description: Experimental, firmware-dependent. Probes read support before writing; returns acknowledged=true, verified=false, not proof the schedule is applied.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false
    start_time:
      name: Start time
      description: Time when WiFi turns OFF (HH:MM).
      required: true
      example: "22:00"
      selector:
        text:
    end_time:
      name: End time
      description: Time when WiFi turns ON (HH:MM).
      required: true
      example: "07:00"
      selector:
        text:
    days:
      name: Days
      description: "Days of week, comma-separated (1=Mon, 7=Sun)."
      required: true
      example: "1,2,3,4,5,6,7"
      selector:
        text:
    enabled:
      name: Enabled
      description: "1 - enable schedule, 0 - disable."
      required: false
      default: "1"
      selector:
        select:
          options:
            - label: "Enable"
              value: "1"
            - label: "Disable"
              value: "0"

set_mac_time:
  name: Set parental control
  description: Experimental, firmware-dependent parental control. Returns acknowledged=true, verified=false; applied schedules cannot currently be verified.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false
    mac:
      name: MAC address
      description: MAC address of the device to restrict.
      required: true
      example: "00:00:00:00:00:00"
      selector:
        text:
    start_time:
      name: Start time
      description: Start time of the restriction period (HH:MM).
      required: true
      example: "22:00"
      selector:
        text:
    end_time:
      name: End time
      description: End time of the restriction period (HH:MM).
      required: true
      example: "07:00"
      selector:
        text:
    days:
      name: Days
      description: "Days of week, comma-separated (1=Mon, 7=Sun)."
      required: true
      example: "1,2,3,4,5,6,7"
      selector:
        text:
    enabled:
      name: Enabled
      description: "1 - enable restriction, 0 - disable."
      required: false
      default: "1"
      selector:
        select:
          options:
            - label: "Enable"
              value: "1"
            - label: "Disable"
              value: "0"

add_mesh_node:
  name: Add mesh node
  description: Experimental mesh pairing. Returns acknowledgement only, verified=false. Acknowledgement does not prove pairing completed.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false
    locate_ip:
      name: Node IP
      description: IP address of the node to add to the mesh network.
      required: true
      example: "192.168.31.2"
      selector:
        text:

set_wifi_macfilter:
  name: Set WiFi MAC filter
  description: Experimental router-wide WiFi filter; may disconnect clients. Returns acknowledgement only, verified=false. For verified client WAN control use set_mac_filter instead.
  fields:
    device_id:
      name: Router
      description: Choose one MiWiFi router, not a tracked client device.
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false
    model:
      name: Filter mode
      description: "0 - disabled, 1 - blacklist (deny listed MACs), 2 - whitelist (allow only listed MACs)."
      required: true
      example: "1"
      selector:
        select:
          options:
            - label: "Disabled"
              value: "0"
            - label: "Blacklist"
              value: "1"
            - label: "Whitelist"
              value: "2"
    mac:
      name: MAC address(es)
      description: "MAC address or multiple MACs separated by semicolons (e.g. AA:BB:CC:DD:EE:FF;11:22:33:44:55:66)."
      required: true
      example: "00:00:00:00:00:00"
      selector:
        text:

get_capabilities:
  name: Read router capabilities
  description: Probe read support for schedules, QoS, port forwarding and DHCP reservations. Does not change router settings.
  fields:
    device_id:
      name: Router
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false

set_band:
  name: Set global WAN bandwidth
  description: Set global QoS bandwidth and verify values directly from the router.
  fields:
    device_id:
      name: Router
      required: true
      selector:
        device:
          filter:
            - integration: miwifi
          multiple: false
    upload:
      name: Upload bandwidth
      required: true
      selector:
        number:
          min: 1
          mode: box
          unit_of_measurement: Mbps
    download:
      name: Download bandwidth
      required: true
      selector:
        number:
          min: 1
          mode: box
          unit_of_measurement: Mbps
